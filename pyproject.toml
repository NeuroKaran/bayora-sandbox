[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bayora-sandbox"
version = "0.1.0"
description = "Secure Adversarial AI Safety Testing Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bayora Sandbox Authors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "requests>=2.32.3",
    "pydantic>=2.9.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2"
]
